name: news_byte
description: "Spaceflight news reader powered by Spaceflight News API"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons:
    ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  dio: ^5.7.0

  json_annotation: ^4.9.0

  cached_network_image: ^3.4.1

  url_launcher: ^6.3.1

  connectivity_plus: ^6.1.0

  shimmer: ^3.0.0

  google_fonts: ^6.2.1

  intl: ^0.19.0

  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  json_serializable: ^6.8.0
  build_runner: ^2.4.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/news_byte.png"
